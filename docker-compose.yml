services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym_logger}
      POSTGRES_USER: ${POSTGRES_USER:-gym_logger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_logger_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gym_logger_postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gym_logger} -d ${POSTGRES_DB:-gym_logger}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_logger_postgres_data:
